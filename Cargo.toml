[workspace]
resolver = "2"
members = [
    "crates/starfane-proto",
    "crates/starfane-emit",
    "crates/starfane-adapters",
    "crates/starfane-tmux",
    "crates/starfane-evidence",
    "crates/starfane-binding",
    "crates/starfane-daemon",
    "bin/starfane",
    "tools/fake-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
starfane-proto = { path = "crates/starfane-proto" }
starfane-emit = { path = "crates/starfane-emit" }
starfane-adapters = { path = "crates/starfane-adapters" }
starfane-tmux = { path = "crates/starfane-tmux" }
starfane-evidence = { path = "crates/starfane-evidence" }
starfane-binding = { path = "crates/starfane-binding" }
starfane-daemon = { path = "crates/starfane-daemon" }

# Minimal external dependencies (default-features = false everywhere)
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "fs", "net", "io-util", "process", "sync", "time", "macros", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
log = { version = "0.4", default-features = false }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = 0
opt-level = 1

[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
